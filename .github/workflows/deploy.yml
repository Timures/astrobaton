name: Deploy Astrobaton Build

on:
  push:
    branches:
      - main # Деплой срабатывает только при пуше в main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Или версия, которую ты используешь
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # Генерирует папку dist

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*" # Копируем ТОЛЬКО содержимое папки dist
          target: "/var/www/astrobaton" # Путь на твоем VPS
          strip_components: 1 # Убирает папку 'dist' из пути при копировании
